# Fly.io deployment config — https://fly.io/docs/reference/configuration/
# Deploy: fly deploy
# Logs:   fly logs
# SSH:    fly ssh console

app = "polymarket-trader"
primary_region = "iad"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "polymarket_data"
  destination = "/data"
